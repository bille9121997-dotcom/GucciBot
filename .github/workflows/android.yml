name: Build GucciBot Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Android64
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: GucciBot-Android
          path: output/*.geode
